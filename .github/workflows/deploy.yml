nome : Deploy Infraestrutura AWS com Terraform

sobre :
  empurrar :
    branches : ["main", "master"]
  workflow_dispatch :

ambiente :
  AWS_REGION : us-east-1
  AWS_ACCESS_KEY_ID : ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY : ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN : ${{ secrets.AWS_SESSION_TOKEN }}
  TF_VAR_db_password : ${{ secrets.DB_PASSWORD }}

empregos :
  terraform :
    runs-on : ubuntu-latest
    passos :
      - nome : Código de checkout
        utiliza : actions/checkout@v4

      - nome : Configurar Terraform
        utiliza : hashicorp/setup-terraform@v3

      - nome : Baixar Terraform State anterior (se existir)
        utiliza : actions/download-artifact@v4
        continuar-em-erro : verdadeiro
        com :
          nome : artefato-tfstate

      - nome : Inicialização do Terraform
        executar : terraform init

      - nome : Validação do Terraform
        executar : terraform validate

      - nome : Plano Terraform
        executar : terraform plan

      - nome : Aplicar Terraform
        execute : terraform apply -auto-approve

      - nome : Exibir saídas
        executar : saída do terraform

      - nome : Enviar Terraform State como Artefato
        utiliza : actions/upload-artifact@v4
        com :
          nome : artefato-tfstate
          caminho : terraform.tfstate
          se nenhum arquivo for encontrado : ignore
